events {}

http {

    server {

        listen 80;

        server_name tk2-216-17599.vs.sakura.ne.jp;

        return 301 https://$host$request_uri;

    }

     server {

        listen 443 ssl;

        server_name tk2-216-17599.vs.sakura.ne.jp;

        ssl_certificate
        /etc/letsencrypt/live/tk2-216-17599.vs.sakura.ne.jp/fullchain.pem;

        ssl_certificate_key
        /etc/letsencrypt/live/tk2-216-17599.vs.sakura.ne.jp/privkey.pem;

        location / {

            proxy_pass http://app:3000;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

    }

}