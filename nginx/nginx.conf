events {}

http {

    server {

        listen 80;

        server_name localhost;

        ssl_certificate
            /etc/nginx/cert/localhost+2.pem;

        ssl_certificate_key
            /etc/nginx/cert/localhost+2-key.pem;

        location / {

            proxy_pass
                http://app:3000;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto
                $scheme;

            proxy_set_header Host $host;

            proxy_set_header X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto
                $scheme;
        }
    }
}